- name: Keep the Frontpage metrics collector publishing after Cloudflare cutover
  hosts: vps
  gather_facts: false
  become: true
  vars:
    upload_secret: "{{ lookup('env', 'FRONTPAGE_UPLOAD_SECRET') }}"
    mark_primary: "{{ lookup('env', 'FRONTPAGE_MARK_CLOUDFLARE_PRIMARY') == '1' }}"
    maintain_collectors: "{{ lookup('env', 'FRONTPAGE_COLLECTOR_MAINTENANCE') == '1' }}"
    collector_package_files: "{{ (lookup('file', 'ansible-playbook.yml') | from_yaml)[0].vars.observer_package_files }}"
  tasks:
    - name: Check Cloudflare-primary maintenance boundary
      ansible.builtin.stat:
        path: /etc/frontpage/cloudflare-primary
      register: primary_marker

    - name: Require a verified primary and exact local source for maintenance
      ansible.builtin.assert:
        that:
          - primary_marker.stat.exists
          - lookup('env', 'FRONTPAGE_DEPLOYED_SHA') is match('^[a-f0-9]{40}$')
          - lookup('env', 'FRONTPAGE_DEPLOYED_SHA') == lookup('pipe', 'git rev-parse HEAD')
          - lookup('pipe', 'git status --porcelain') == ''
          - lookup('env', 'FRONTPAGE_OBSERVABILITY_V2_PROMOTE') != '1'
        fail_msg: "Collector maintenance requires Cloudflare primary and the exact checked-out SHA; it cannot promote v2."
      when: maintain_collectors

    - name: Inspect promoted collector before shadow maintenance
      ansible.builtin.command:
        argv: [systemctl, is-enabled, frontpage-metrics-collector-v2.service]
      register: promoted_collector
      changed_when: false
      failed_when: false
      when: maintain_collectors

    - name: Refuse shadow maintenance of an already promoted collector
      ansible.builtin.assert:
        that:
          - promoted_collector.stdout != 'enabled'
        fail_msg: "Shadow maintenance cannot restart a second writer beside the promoted collector."
      when: maintain_collectors

    - name: Require a collector upload secret
      ansible.builtin.assert:
        that:
          - upload_secret | length >= 32
        fail_msg: "FRONTPAGE_UPLOAD_SECRET must be supplied from 1Password."
      no_log: true
      when: not maintain_collectors

    - name: Require the deployed Worker commit before switching collector topology
      ansible.builtin.assert:
        that:
          - lookup('env', 'FRONTPAGE_DEPLOYED_SHA') is match('^[a-f0-9]{40}$')
      when: mark_primary

    - name: Check the active v1 collector snapshots
      ansible.builtin.stat:
        path: "/var/lib/frontpage-metrics/v1/{{ item }}"
      loop: [latest.json, history.json]
      register: snapshots

    - name: Require both active snapshots
      ansible.builtin.assert:
        that:
          - snapshots.results | map(attribute='stat.exists') | min

    - name: Install uploader
      ansible.builtin.copy:
        src: ops/frontpage-metrics-upload.py
        dest: /usr/local/bin/frontpage-metrics-upload
        owner: root
        group: root
        mode: '0755'

    - name: Install collector upload secret
      ansible.builtin.copy:
        content: "{{ upload_secret }}"
        dest: /etc/frontpage-metrics/cloudflare-upload-secret
        owner: root
        group: frontpage-metrics
        mode: '0640'
      no_log: true
      when: not maintain_collectors

    - name: Install upload units
      ansible.builtin.copy:
        src: "ops/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - frontpage-metrics-upload.service
        - frontpage-metrics-upload.timer

    - name: Enable upload timer
      ansible.builtin.systemd:
        name: frontpage-metrics-upload.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Upload the first snapshots
      ansible.builtin.systemd:
        name: frontpage-metrics-upload.service
        state: started

    - name: Switch collector checks from the retired VPS app to the live Worker
      ansible.builtin.template:
        src: ops/frontpage-metrics.cloudflare.json.j2
        dest: "/etc/frontpage-metrics/{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
        backup: true
      loop:
        - { source: 'ops/frontpage-metrics.config.json', dest: 'config.json' }
        - { source: 'ops/frontpage-metrics-v2.config.json', dest: 'config-v2.json' }
      register: cloudflare_collector_configs
      when: mark_primary or maintain_collectors

    - name: Install collector and comparator maintenance executables
      ansible.builtin.copy:
        src: "ops/{{ item.source }}"
        dest: "/usr/local/bin/{{ item.dest }}"
        owner: root
        group: root
        mode: '0755'
        backup: true
      loop:
        - { source: 'frontpage-metrics-collector.py', dest: 'frontpage-metrics-collector' }
        - { source: 'frontpage-metrics-collector-v2.py', dest: 'frontpage-metrics-collector-v2' }
        - { source: 'frontpage-metrics-shadow-compare.py', dest: 'frontpage-metrics-shadow-compare' }
      register: collector_executables
      when: maintain_collectors

    - name: Install tracked collector package sources for maintenance
      ansible.builtin.copy:
        src: "ops/frontpage_metrics_v2/{{ item }}"
        dest: "/usr/local/lib/frontpage/ops/frontpage_metrics_v2/{{ item }}"
        owner: root
        group: root
        mode: '0644'
        backup: true
      loop: "{{ collector_package_files }}"
      register: collector_package
      when: maintain_collectors

    - name: Install aligned collector units for maintenance
      ansible.builtin.copy:
        src: "ops/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
        backup: true
      loop:
        - frontpage-metrics-collector.service
        - frontpage-metrics-collector.timer
        - frontpage-metrics-collector-v2-shadow.service
      register: collector_units
      when: maintain_collectors

    - name: Determine whether collector comparison semantics changed
      ansible.builtin.set_fact:
        comparison_changed: >-
          {{ cloudflare_collector_configs.changed
             or (collector_executables.changed | default(false))
             or (collector_package.changed | default(false))
             or (collector_units.changed | default(false)) }}
      when: mark_primary or maintain_collectors

    - name: Clear retired VPS app runtime allowlist
      ansible.builtin.copy:
        content: "[]\n"
        dest: /etc/frontpage-metrics/runtime-allowlist.json
        owner: root
        group: root
        mode: '0644'
        backup: true
      register: cloudflare_runtime_allowlist
      when: mark_primary

    - name: Clear retired VPS app runtime map
      ansible.builtin.copy:
        content: "{{ {'generated_at': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'), 'workloads': []} | to_nice_json }}\n"
        dest: /run/frontpage-metrics/runtime-map.json
        owner: frontpage-observer
        group: frontpage-observer
        mode: '0640'
      when: mark_primary

    - name: Include runtime allowlist changes in the evidence boundary
      ansible.builtin.set_fact:
        comparison_changed: "{{ comparison_changed or (cloudflare_runtime_allowlist.changed | default(false)) }}"
      when: mark_primary or maintain_collectors

    - name: Refresh v1 collector after origin switch
      ansible.builtin.systemd:
        name: frontpage-metrics-collector.service
        state: restarted
        daemon_reload: true
      when: (mark_primary or maintain_collectors) and comparison_changed

    - name: Keep the aligned v1 timer enabled
      ansible.builtin.systemd:
        name: frontpage-metrics-collector.timer
        state: restarted
        enabled: true
        daemon_reload: true
      when: maintain_collectors and collector_units.changed

    - name: Refresh v2 shadow collector after workload switch
      ansible.builtin.systemd:
        name: frontpage-metrics-collector-v2-shadow.service
        state: restarted
      when: (mark_primary or maintain_collectors) and comparison_changed

    - name: Read host clock after repaired collectors start
      ansible.builtin.command:
        argv: [date, -u, -d, '+60 seconds', '+%Y-%m-%dT%H:%M:%SZ']
      register: evidence_clock
      changed_when: false
      when: (mark_primary or maintain_collectors) and comparison_changed

    - name: Start a new shadow comparison epoch after collector topology changes
      ansible.builtin.copy:
        content: "{{ {'schema_version': 1, 'started_at': evidence_clock.stdout, 'commit_sha': lookup('env', 'FRONTPAGE_DEPLOYED_SHA'), 'reason': 'collector_or_comparator_change'} | to_nice_json }}\n"
        dest: /var/lib/frontpage-metrics/shadow-evidence-epoch.json
        owner: root
        group: root
        mode: '0600'
        backup: true
      when:
        - mark_primary or maintain_collectors
        - comparison_changed or (cloudflare_runtime_allowlist.changed | default(false))

    - name: Upload the Cloudflare-primary collector snapshot
      ansible.builtin.systemd:
        name: frontpage-metrics-upload.service
        state: started
      when: mark_primary

    - name: Mark Cloudflare as primary after live cutover verification
      ansible.builtin.file:
        path: /etc/frontpage
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: mark_primary

    - name: Record Cloudflare as primary after live cutover verification
      ansible.builtin.copy:
        content: "Cloudflare is the Frontpage production origin; use FRONTPAGE_VPS_ROLLBACK=1 for intentional VPS restore.\n"
        dest: /etc/frontpage/cloudflare-primary
        owner: root
        group: root
        mode: '0644'
      when: mark_primary
