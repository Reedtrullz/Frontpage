name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/frontpage-*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.22.3'

jobs:
  test:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --include=optional
      - run: npm audit --include=dev --audit-level=critical
      - run: npm test
      - run: node --test scripts/*.test.mjs
      - name: Operator restore transport regressions
        run: node --test ops/owner-state-transport.test.mjs
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Install Ansible validation dependencies
        run: |
          python3 -m pip install -r ops/requirements-ansible.txt
          ansible-galaxy collection install -r ops/ansible/requirements.yml
      - run: python3 -m unittest discover -s ops/tests
      - run: python3 -m compileall -q ops/frontpage_metrics_v2 ops/frontpage-metrics-collector.py ops/frontpage-metrics-collector-v2.py ops/frontpage-metrics-runtime-map.py ops/frontpage-metrics-shadow-compare.py
      - name: Check Ansible deployment syntax
        run: |
          trap 'rm -f .vault_pass' EXIT
          printf 'frontpage-ci-vault-password\n' > .vault_pass
          ansible-playbook --syntax-check -i inventory/hosts.yml ansible-playbook.yml --vault-password-file .vault_pass
          ansible-playbook --syntax-check -i inventory/hosts.yml ansible-cloudflare-collector.yml --vault-password-file .vault_pass
          ansible-playbook --syntax-check -i inventory/hosts.yml ansible-cloudflare-proposals-origin.yml --vault-password-file .vault_pass
          ansible-playbook --syntax-check -i inventory/hosts.yml ansible-cloudflare-v2-upload.yml --vault-password-file .vault_pass
      - run: npm run build
        env:
          CI: true
          AUTH_SECRET: frontpage-ci-build-secret
          VERSION: ci-${{ github.sha }}
      - name: Build Cloudflare Durable Object candidate
        run: npm run build:cloudflare
        env:
          CI: true
          AUTH_SECRET: frontpage-ci-build-secret
          VERSION: ci-${{ github.sha }}
      - name: Install runtime browser
        run: npx playwright install --with-deps chromium
      - name: Exercise built Worker and Durable Object runtime
        run: npm run test:cloudflare
      - name: Validate Cloudflare upload bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run

  browser:
    name: Public browser & accessibility
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --include=optional
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          CI: true
          AUTH_SECRET: frontpage-ci-browser-secret
          VERSION: ci-${{ github.sha }}
          FRONTPAGE_E2E_OWNER: '1'
          FRONTPAGE_E2E_OWNER_TOKEN: frontpage-e2e-owner-token
          OWNER_GITHUB_ID: e2e-owner
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker-check:
    name: Docker build & runtime check (${{ matrix.arch }})
    needs: [test, browser]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: frontpage:ci-${{ matrix.arch }}-${{ github.sha }}
          cache-from: type=gha,scope=frontpage-${{ matrix.arch }}
          cache-to: type=gha,scope=frontpage-${{ matrix.arch }},mode=max
          build-args: |
            VERSION=pr-${{ github.sha }}

      - name: Run Docker runtime smoke
        run: node tests/docker-runtime-smoke.mjs --image frontpage:ci-${{ matrix.arch }}-${{ github.sha }} --version pr-${{ github.sha }}

  publish:
    name: Build & publish image
    needs: [test, browser, docker-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=sha-${{ github.sha }}

      - name: Run published image smoke
        run: |
          image="$(printf '%s\n' "$DOCKER_METADATA_OUTPUT_TAGS" | awk '/:sha-/ { print; exit }')"
          test -n "$image"
          node tests/docker-runtime-smoke.mjs --image "$image" --version sha-${{ github.sha }}

      - name: Summary
        run: |
          latest_image="$(printf '%s\n' "$DOCKER_METADATA_OUTPUT_TAGS" | head -n 1)"
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with: \`docker pull $latest_image\`" >> $GITHUB_STEP_SUMMARY

  preload:
    name: Preload deploy image on VPS
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FRONTPAGE_VPS_DEPLOY_ENABLED != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Install verified RackNerd host key
        env:
          RACKNERD_KNOWN_HOSTS: ${{ secrets.RACKNERD_KNOWN_HOSTS }}
        run: node scripts/install-known-hosts.mjs --output "$HOME/.ssh/known_hosts"

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519_racknerd"
          chmod 600 "$HOME/.ssh/id_ed25519_racknerd"

      - name: Authenticate and preload immutable image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i "$HOME/.ssh/id_ed25519_racknerd" \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            deploy@198.23.137.16 \
            "sudo docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin >/dev/null"
          ssh \
            -i "$HOME/.ssh/id_ed25519_racknerd" \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            deploy@198.23.137.16 \
            "sudo docker pull '$image'"

  deploy-cloudflare:
    name: Deploy to Cloudflare
    needs: [test, browser, docker-check, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FRONTPAGE_CLOUDFLARE_DEPLOY_ENABLED == '1'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --include=optional
      - name: Build exact commit for Cloudflare
        run: npm run build:cloudflare
        env:
          CI: true
          AUTH_SECRET: frontpage-ci-build-secret
          VERSION: ${{ github.sha }}
      - name: Deploy production Worker
        run: npx wrangler deploy --config wrangler.jsonc --name frontpage --var VERSION:${{ github.sha }} --var PROPOSALS_ORIGIN:https://proposals-origin.reidar.tech
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify Worker commit
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error https://frontpage.reidjoss.workers.dev/api/health \
              | jq -e --arg commit "$GITHUB_SHA" '.status == "healthy" and .version == $commit'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify intended domain release
        run: node scripts/verify-release.mjs --base-url https://reidar.tech --expected-sha "$GITHUB_SHA"
