- name: Verify requested deployment image is present before container stop
  community.docker.docker_image_info:
    name: "{{ docker_image }}"
  register: deployment_image_info

- name: Verify previous rollback image is present before container stop
  community.docker.docker_image_info:
    name: "{{ previous_image }}"
  register: rollback_image_info
  when: previous_image != "none"

- name: Render new and rollback container arguments before container stop
  ansible.builtin.set_fact:
    frontpage_new_env: >-
      {{
        {
          'NODE_ENV': 'production',
          'PORT': '3000',
          'HOSTNAME': '0.0.0.0',
          'VERSION': deploy_commit_sha,
          'DATA_DIR': '/data',
          'AUTH_URL': 'https://reidar.tech',
          'AUTH_SECRET': vault_auth_secret,
          'AUTH_GITHUB_ID': vault_auth_github_id,
          'AUTH_GITHUB_SECRET': vault_auth_github_secret,
          'OWNER_GITHUB_ID': app_owner_github_id,
          'GITHUB_TOKEN': vault_github_token,
          'METRICS_DIR': '/metrics'
        }
        | combine(
            {
              'PUBLIC_METRICS_DIR': '/metrics-public',
              'OWNER_METRICS_DIR': '/metrics-owner',
              'FRONTPAGE_OBSERVABILITY_V2': '1'
            } if observability_v2_enabled else {}
          )
      }}
    frontpage_new_volumes: >-
      {{
        [
          (docker_volume_data | default('frontpage_data')) ~ ':/data',
          metrics_v1_dir ~ ':/metrics:ro'
        ]
        + (
            [
              metrics_dir ~ '/v2/public:/metrics-public:ro',
              metrics_dir ~ '/v2/owner:/metrics-owner:ro'
            ] if observability_v2_enabled else []
          )
      }}
    frontpage_rollback_env: >-
      {{
        {
          'NODE_ENV': 'production',
          'PORT': '3000',
          'HOSTNAME': '0.0.0.0',
          'VERSION': previous_version,
          'DATA_DIR': '/data',
          'AUTH_URL': 'https://reidar.tech',
          'AUTH_SECRET': vault_auth_secret,
          'AUTH_GITHUB_ID': vault_auth_github_id,
          'AUTH_GITHUB_SECRET': vault_auth_github_secret,
          'OWNER_GITHUB_ID': app_owner_github_id,
          'GITHUB_TOKEN': vault_github_token,
          'METRICS_DIR': '/metrics'
        }
        | combine(
            {
              'PUBLIC_METRICS_DIR': '/metrics-public',
              'OWNER_METRICS_DIR': '/metrics-owner',
              'FRONTPAGE_OBSERVABILITY_V2': '1'
            } if previous_observability_v2_enabled else {}
          )
      }}
    frontpage_rollback_volumes: >-
      {{
        [
          (docker_volume_data | default('frontpage_data')) ~ ':/data',
          metrics_v1_dir ~ ':/metrics:ro'
        ]
        + (
            [
              metrics_dir ~ '/v2/public:/metrics-public:ro',
              metrics_dir ~ '/v2/owner:/metrics-owner:ro'
            ] if previous_observability_v2_enabled else []
          )
      }}
  no_log: true

- name: Validate deployment and rollback facts before container stop
  ansible.builtin.assert:
    that:
      - deployment_image_info.images | default([]) | length > 0
      - previous_image == "none" or (rollback_image_info.images | default([]) | length > 0)
      - deploy_commit_sha is match('^[a-f0-9]{40}$')
      - docker_image is match('^ghcr\.io/[^:]+:sha-[a-f0-9]{40}$')
      - app_owner_github_id is match('^[0-9]+$')
      - metrics_group_id is match('^[0-9]+$')
      - observability_v2_enabled is boolean
      - previous_observability_v2_enabled is boolean
      - image_preloaded is boolean
      - frontpage_new_env.VERSION == deploy_commit_sha
      - frontpage_new_env.METRICS_DIR == '/metrics'
      - frontpage_new_volumes | select('search', ':ro$') | list | length >= 1
      - previous_image == "none" or previous_version is match('^[a-f0-9]{40}$')
      - previous_image == "none" or frontpage_rollback_env.VERSION == previous_version
      - previous_image == "none" or frontpage_rollback_volumes | select('search', ':ro$') | list | length >= 1
    fail_msg: "Deployment or rollback arguments are not safe to apply after container stop."
